name: zloui
description: "A sleek Material You client for self-hosted Open WebUI instances."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  mime: ^2.1.0
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
